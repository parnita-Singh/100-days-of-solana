<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Antonio:wght@100..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solana Devnet Dashboard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        background: #662549;
        color: #e0e0e0;
      }
      h1 { color: #F39F5A;
          font-family:antonio;
          font-weight:200; }
      input {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-family: monospace;
        border: 1px solid #333;
        border-radius: 10px;
        background: #1D1A39;
        color: #e0e0e0;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        padding: 10px 20px;
        background: #AE445A;
        color: #1a1a2e;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover { background: #F39F5A; }
      .balance { font-size: 24px; margin: 20px 0; }
      .tx {
        background: #1D1A39;
        padding: 12px;
        margin: 8px 0;
        border-radius: 4px;
        font-family: anton;
        font-size: 12px;
        word-break: break-all;
      }
      .tx .status { color: #F39F5A; }
      .tx .status.failed { color: #AE445A; }
      #error { color: #AE445A; margin: 10px 0; }
      #loading { color: #888; margin: 10px 0; }
    </style>
  </head>
  <body>
    <h1>PARNITA'S SOLANA DEVNET DASHBOARD</h1>
    <input
      type="text"
      id="addressInput"
      placeholder="Enter a Solana devnet address"
      value="TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
    />
    <button id="fetchBtn">Let's Fetch Your Data</button>
    <div id="error"></div>
    <div id="loading"></div>
    <div id="results"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
